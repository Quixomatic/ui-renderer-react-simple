name: Publish to npm

# Push a version tag to publish:  git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags:
      - 'v2.*.*'

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Test (builds dist/ first)
        run: npm test

      - name: Skip if this version is already on npm
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already published; nothing to do."
          fi

      - name: Publish
        if: steps.published.outputs.already != 'true'
        # prepack runs the build, so dist/ is always fresh in the tarball.
        run: npm publish --access public --provenance
        env:
          # Classic automation token. Not needed if npm trusted publishing is configured
          # for this repository on npmjs.com (OIDC via id-token above).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
