name: Test Package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests (renderer + babel patcher)
        run: npm test

      - name: Pack
        run: npm pack

      - name: Setup script in a fresh project
        shell: bash
        run: |
          # Resolve via node: Git Bash's $PWD (/d/a/...) is not a path Windows npm understands.
          TGZ="$(node -p "require('path').resolve(require('fs').readdirSync('.').find((f) => f.endsWith('.tgz'))).split(require('path').sep).join('/')")"
          mkdir test-project && cd test-project
          npm init -y > /dev/null
          npm install "$TGZ"
          # No ServiceNow CLI on CI runners, so skip the babel patch here.
          npx setup-servicenow-react --skip-patch --spec "file:$TGZ"
          npm install
          node -e "
            const pkg = require('./package.json');
            for (const name of ['@servicenow/ui-renderer-react', 'react', 'react-dom']) {
              if (pkg.dependencies[name] !== 'file:react-shim') throw new Error(name + ' is not file:react-shim');
            }
            if (!require('fs').existsSync('react-shim/index.js')) throw new Error('react-shim not written');
          "
          node --input-type=module -e "
            const renderer = await import('@servicenow/ui-renderer-react');
            const react = await import('react');
            const client = await import('react-dom/client');
            const jsx = await import('react/jsx-runtime');
            for (const k of ['onStateChange', 'onConnect', 'onDisconnect', 'createElement', 'Fragment']) {
              if (!renderer.default[k]) throw new Error('renderer missing ' + k);
            }
            if (!/^19\./.test(react.version)) throw new Error('react is ' + react.version);
            const internals = '__CLIENT_INTERNALS_DO_NOT_USE_OR_WARN_USERS_THEY_CANNOT_UPGRADE';
            if (react[internals] !== renderer[internals] || client.createRoot !== renderer.createRoot || jsx.jsx !== renderer.jsx) {
              throw new Error('react, react-dom/client, react/jsx-runtime and the renderer are not one React instance');
            }
            console.log('✅ react, react-dom/client, react/jsx-runtime and @servicenow/ui-renderer-react are one React ' + react.version);
          "
